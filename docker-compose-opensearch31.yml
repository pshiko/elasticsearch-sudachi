version: '3.8'

services:
  opensearch-3-1:
    image: opensearchproject/opensearch:3.1.0
    container_name: opensearch-3-1-test
    environment:
      - cluster.name=sudachi-test-31
      - node.name=test-node
      - discovery.type=single-node
      - plugins.security.disabled=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - "OPENSEARCH_INITIAL_ADMIN_PASSWORD=AdminPassword123!"
    ports:
      - "9201:9200"
      - "9601:9600"
    volumes:
      - ./test-scripts/opensearch.yml:/usr/share/opensearch/config/opensearch.yml:ro
    networks:
      - opensearch-31-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  opensearch-31-network:
    driver: bridge